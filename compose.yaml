services:

  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=${DATABASE_PASSWORD:?Defina DATABASE_PASSWORD}'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432'
      
  redis:
    image: 'redis:latest'
    ports:
      - '6379'
